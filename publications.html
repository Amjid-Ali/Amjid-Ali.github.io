<div class="container">

    <!-- Publications will be dynamically added here -->

</div>

<script>
  // Your text data containing publication information
  const publicationsText = `/*
  @article{qasim2024abandoned,
  title={Abandoned Object Detection and Classification Using Deep Embedded Vision},
  author={Qasim, Arbab Muhammad and Abbas, Naveed and Ali, Amjid and Al-Ghamdi, Bandar Ali Al-Rami},
  journal={IEEE Access},
  year={2024},
  publisher={IEEE}
}

  @article{ali2026avarnet,
  title={AVAR-Net: A Lightweight Audio-Visual Anomaly Recognition Framework with a Benchmark Dataset (Under Review)},
  author={Ali, Amjid and Khan, Zulfiqar Ahmad and Hussain, Altaf and Munsif, Muhammad and Adnan and Baik, Sung Wook},
  journal={Expert Systems with Applications},
  year={2026},
  publisher={Elsevier}
}

  @article{ali2026dualmodality,
  title={Dual-Modality Visual-Audio Fusion and a New Benchmark for Anomaly Recognition in Dynamic Scenes (Under Review)},
  author={Ali, Amjid and Khan, Zulfiqar Ahmad},
  journal={Information Sciences},
  year={2026},
  publisher={Elsevier}
}

  @article{munsif2025multicamera,
  title={Multi-Camera Connected Vision System with Multi-View Analytics: A Comprehensive Survey (Submitted)},
  author={Munsif, Muhammad and Ahmad, Waqas and Ali, Amjid and Ullah, Mohib},
  journal={Big Data},
  year={2025},
  publisher={Mary Ann Liebert}
}

  @article{ali2026sgacmf,
  title={SGA-CMF: Spatially-Grounded Attribute Cross-Modal Fusion for VLM Adaptation in Remote Sensing Scene Classification (Ready to Submit)},
  author={Ali, Amjid and Ali, Usman and Khan, Zulfiqar Ahmad},
  journal={},
  year={2026},
  publisher={}
}

  @inproceedings{yar2024modifiedvit,
  title={A Modified Vision Transformer-based Anomaly Recognition Using Audio Data},
  author={Yar, Hikmat and Ali, Amjid and Khan, Zulfiqar Ahmad and Khan, Noman and Kim, Min Je and Lee, Su Min and Baik, Sung Wook},
  journal={KINGPC},
  year={2024},
  publisher={}
}

  @inproceedings{ali2024activelearning,
  title={Active Learning for Anomaly Recognition: Leveraging Visual and Audio Data Fusion},
  author={Ali, Amjid and Khan, Noman and Khan, Zulfiqar Ahmad and Lee, Su Min and Kim, Min Je and Baik, Sung Wook},
  journal={ICNGC, Jeju, South Korea},
  pages={133--135},
  year={2024},
  publisher={}
}

  @inproceedings{ali2025semisupervised,
  title={Audio-Visual Semi-Supervised Framework for Real-Time Anomaly Recognition},
  author={Ali, Amjid and Khan, Noman and Khan, Zulfiqar Ahmad and Lee, Su Min and Kim, Min Je and Baik, Sung Wook},
  journal={ICNGC, Jeju, South Korea},
  year={2025},
  publisher={}
}

  @inproceedings{ullah2025migration,
  title={Learning Inter-City Migration Flow Centered on Shinan-gun Using Graph Neural Networks},
  author={Ullah, Safi and Ali, Amjid and Kim, Min Je and Lee, Seung Woo and Lee, Young Hwan and Baik, Sung Wook},
  journal={KINGPC},
  year={2025},
  publisher={}
} */`;

  // Split the text into individual publications
  const publications = publicationsText.split('\n\n');

  // Create a dictionary to store publications by year
  const publicationsByYear = {};

  // Iterate over each publication
  publications.forEach(publication => {
    // Extract year from each publication
    const yearMatch = publication.match(/year={([^}]*)}/);
    if (yearMatch) {
      const year = parseInt(yearMatch[1]);
      // Add publication to the respective year array in the dictionary
      if (!publicationsByYear[year]) {
        publicationsByYear[year] = [];
      }
      publicationsByYear[year].push(publication);
    }
  });

  const publicationList = document.getElementById('publication-list');

  // Iterate over publications by year and display them
  Object.keys(publicationsByYear).sort((a, b) => b - a).forEach(year => {
    // Create header for each year
    const yearHeader = document.createElement('div');
    yearHeader.classList.add('year-header');
    yearHeader.textContent = year;
    publicationList.appendChild(yearHeader);

    // Iterate over publications for the current year
    publicationsByYear[year].forEach(publication => {
      // Extract information from the publication
      const titleMatch = publication.match(/title={([^}]*)}/);
      const authorMatch = publication.match(/author={([^}]*)}/);
      const volumeMatch = publication.match(/volume={([^}]*)}/);
      const publisherMatch = publication.match(/publisher={([^}]*)}/);
      const journalMatch = publication.match(/journal={([^}]*)}/);

      if (titleMatch && authorMatch && journalMatch && volumeMatch && publisherMatch) {
        const title = titleMatch[1];
        const authors = authorMatch[1].split(' and ').map(author => {
          // Rearrange author names
          const [lastName, firstName] = author.split(',').map(name => name.trim());
          return `${firstName} ${lastName}`;
        }).join(', ');
        const journal = journalMatch[1];
        const volume = volumeMatch[1];
        const publisher = publisherMatch[1];

        // Create list item for the publication
        const listItem = document.createElement('li');
        listItem.innerHTML = `<strong>${title}</strong><br>Authors: ${authors}<br>Volume: ${volume}<br>Publisher: ${publisher}<br>Journal: ${journal}`;

        // Append list item to the publication list
        publicationList.appendChild(listItem);
      }
    });
  });

</script>
