<script>
  const PUBS = [
    { type:'journal', year:2024, title:'Abandoned Object Detection and Classification Using Deep Embedded Vision',
      authors:'Arbab Muhammad Qasim, Naveed Abbas, Amjid Ali, Bandar Ali Al-Rami Al-Ghamdi',
      venue:'IEEE Access', meta:'Impact Factor 3.60 | Rank Q2', status:'Published' },

    { type:'journal', year:2026, title:'AVAR-Net: A Lightweight Audio-Visual Anomaly Recognition Framework with a Benchmark Dataset',
      authors:'Amjid Ali, Zulfiqar Ahmad Khan, Altaf Hussain, Muhammad Munsif, Adnan, Sung Wook Baik',
      venue:'Expert Systems with Applications', meta:'Impact Factor 8.66 | Rank Q1', status:'Under review' },

    { type:'journal', year:2026, title:'Dual-Modality Visual-Audio Fusion and a New Benchmark for Anomaly Recognition in Dynamic Scenes',
      authors:'Amjid Ali, Zulfiqar Ahmad Khan',
      venue:'Information Sciences', meta:'Impact Factor 6.8 | Rank Q1', status:'Under review' },

    { type:'journal', year:2025, title:'Multi-Camera Connected Vision System with Multi-View Analytics: A Comprehensive Survey',
      authors:'Muhammad Munsif, Waqas Ahmad, Amjid Ali, Mohib Ullah',
      venue:'Big Data', meta:'Impact Factor 2.0 | Rank Q3', status:'Submitted - preprint on arXiv' },

    { type:'journal', year:2026, title:'SGA-CMF: Spatially-Grounded Attribute Cross-Modal Fusion for VLM Adaptation in Remote Sensing Scene Classification',
      authors:'Amjid Ali, Usman Ali, Zulfiqar Ahmad Khan',
      venue:'', meta:'', status:'Ready to submit' },

    { type:'conference', year:2024, title:'A Modified Vision Transformer-based Anomaly Recognition Using Audio Data',
      authors:'Hikmat Yar, Amjid Ali, Zulfiqar Ahmad Khan, Noman Khan, Min Je Kim, Su Min Lee, Sung Wook Baik',
      venue:'KINGPC 2024', meta:'', status:'Accepted, in publication process' },

    { type:'conference', year:2024, title:'Active Learning for Anomaly Recognition: Leveraging Visual and Audio Data Fusion',
      authors:'Amjid Ali, Noman Khan, Zulfiqar Ahmad Khan, Su Min Lee, Min Je Kim, Sung Wook Baik',
      venue:'ICNGC 2024, Jeju, South Korea', meta:'pp. 133-135', status:'' },

    { type:'conference', year:2025, title:'Audio-Visual Semi-Supervised Framework for Real-Time Anomaly Recognition',
      authors:'Amjid Ali, Noman Khan, Zulfiqar Ahmad Khan, Su Min Lee, Min Je Kim, Sung Wook Baik',
      venue:'ICNGC 2025, Jeju, South Korea', meta:'', status:'' },

    { type:'conference', year:2025, title:'Learning Inter-City Migration Flow Centered on Shinan-gun Using Graph Neural Networks',
      authors:'Safi Ullah, Amjid Ali, Min Je Kim, Seung Woo Lee, Young Hwan Lee, Sung Wook Baik',
      venue:'KINGPC 2025', meta:'', status:'Accepted, in publication process' }
  ];

  const list = document.getElementById('publication-list');

  function bold(authors) {
    return authors.replace(/Amjid Ali/g, '<span style="color:#c8e500;font-weight:bold">Amjid Ali</span>');
  }

  function render(label, items) {
    if (!items.length) return;
    const h = document.createElement('div');
    h.className = 'year-header';
    h.textContent = label;
    list.appendChild(h);

    items.sort((a, b) => b.year - a.year).forEach(p => {
      const li = document.createElement('li');
      let html = '<strong>' + p.title + '</strong>';
      html += '<br><span class="authors">' + bold(p.authors) + '</span>';
      if (p.venue)  html += '<br><span class="journal">' + p.venue + ' (' + p.year + ')</span>';
      else          html += '<br><span class="journal">' + p.year + '</span>';
      if (p.meta)   html += '<br><span class="volume">' + p.meta + '</span>';
      if (p.status) html += '<br><span class="year">' + p.status + '</span>';
      li.innerHTML = html;
      list.appendChild(li);
    });
  }

  render('Journal Articles',   PUBS.filter(p => p.type === 'journal'));
  render('Conference Papers',  PUBS.filter(p => p.type === 'conference'));
</script>
